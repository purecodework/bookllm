name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          XCODE_APP=$(python3 -c 'import pathlib,re; apps=list(pathlib.Path("/Applications").glob("Xcode_16*.app")); print(max(apps,key=lambda p:tuple(map(int,re.findall(r"\d+",p.name))),default=""))')
          if [ -z "$XCODE_APP" ]; then echo 'Xcode 16 is required'; exit 1; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Translation engine tests
        working-directory: ios/Packages/TranslationCore
        run: swift test
      - name: Resolve app packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project BookLLM.xcodeproj -scheme BookLLM
      - name: Build iOS Simulator app
        working-directory: ios
        run: >-
          xcodebuild -project BookLLM.xcodeproj -scheme BookLLM
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BookLLM-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/BookLLM.app
          if-no-files-found: error
