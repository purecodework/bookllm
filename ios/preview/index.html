function homeHTML(){const featured=docs.findLast(d=>d.coverDataURL)||docs[0],recent=docs.filter(d=>d.id!==featured.id);return '<header class="topbar"><div class="app-brand">译间<small>BOOKLLM</small></div><button class="icon-button" data-action="import" aria-label="导入文稿">'+icon('plus')+'</button></header><div class="row spread"><h1 class="section-title">继续阅读</h1><span class="small muted" style="font-size:10px">'+docs.length+' 份文稿</span></div><div class="book-card">'+(docCover(featured)||'<div class="cover" aria-hidden="true"><span class="cover-label">BOOKLLM</span><div class="cover-title">黄昏的<br>花园</div><div class="cover-rule"></div><span class="cover-en">THE GARDEN<br>AT DUSK</span></div>')+'<div class="book-details"><span class="pill '+(featured.sample?'green':'gray')+'">'+(featured.sample?'示例译本':'已导入')+'</span><h2 class="serif">'+esc(featured.title)+'</h2><p class="small muted" style="font-size:10px;margin:0">'+detectSourceLanguage(featured.source)+' · '+featured.format+'</p><button class="read-button" data-read="'+esc(featured.id)+'">继续阅读 '+icon('arrow')+'</button></div></div><div class="row spread section-row"><h2 class="section-title">书架</h2></div>'+recent.map(d=>'<button class="document-row" data-read="'+esc(d.id)+'"><span class="doc-icon">'+(docCover(d,true)||icon('doc'))+'</span><span class="doc-info"><b>'+esc(d.title)+'</b><small>'+esc(d.format)+' · '+detectSourceLanguage(d.source)+'</small></span><span class="pill '+(d.sample?'green':'gray')+'">'+(d.sample?'示例':'原文')+'</span></button>').join('')+'<button class="button new-translation" data-action="import">'+icon('plus')+'导入文稿</button><button class="sample-shortcut" data-action="sample-config">体验示例翻译 '+icon('arrow')+'</button><div class="deepseek-foot">DeepSeek · 交互演示</div>'}

function qualityHTML(){const idx=['fast','refined','publication'].indexOf(state.quality),ratio=idx/2;return '<div class="strength-header"><b id="quality-heading">'+qualityInfo[state.quality].name+'</b><span id="quality-roles">'+stages().map(s=>roleNames[s]).join(' · ')+'</span></div><div id="quality-slider" class="strength-slider" role="slider" tabindex="0" aria-label="翻译强度" aria-valuemin="0" aria-valuemax="2" aria-valuenow="'+idx+'" aria-valuetext="'+qualityInfo[state.quality].name+'"><div class="strength-track"><span class="strength-fill" style="width:calc('+ratio*100+'% + '+(20-56*ratio)+'px)"></span>'+[0,1,2].map(i=>'<i class="strength-dot '+(i<=idx?'filled':'')+'" style="left:'+['28px','50%','calc(100% - 28px)'][i]+'"></i>').join('')+'<span class="strength-thumb" style="left:'+['28px','50%','calc(100% - 28px)'][idx]+'"></span></div></div>'}
function updateQualitySlider(index,visualRatio=null){index=Math.max(0,Math.min(2,index));state.quality=['fast','refined','publication'][index];const slider=$('#quality-slider');if(!slider)return;const ratio=visualRatio??index/2;slider.setAttribute('aria-valuenow',String(index));slider.setAttribute('aria-valuetext',qualityInfo[state.quality].name);$('.strength-fill',slider).style.width='calc('+ratio*100+'% + '+(20-56*ratio)+'px)';$('.strength-thumb',slider).style.left='calc('+ratio*100+'% + '+(28-56*ratio)+'px)';slider.querySelectorAll('.strength-dot').forEach((dot,i)=>dot.classList.toggle('filled',i<=index));$('#quality-heading').textContent=qualityInfo[state.quality].name;$('#quality-roles').textContent=stages().map(s=>roleNames[s]).join(' · ');}

function glossaryHTML(){let mode=state.glossaryMode;return '<div class="segmented" role="group" aria-label="术语库模式">'+[['automatic','系统自动'],['review','我先校对'],['custom','我的术语库']].map(([v,l])=>'<button data-glossary="'+v+'" class="'+(mode===v?'active':'')+'" aria-pressed="'+(mode===v)+'">'+l+'</button>').join('')+'</div><div class="glossary-box">'+(mode==='automatic'?'<p class="field-caption">统一全篇译法。</p>':'<div class="row spread glossary-head"><span class="small muted" style="font-size:10px">'+(mode==='review'?'确认译法':'固定译法')+'</span><button class="text-button" data-action="add-term" style="font-size:10px">+ 添加</button></div>'+state.terms.map((t,i)=>'<div class="term-row"><input aria-label="术语 '+(i+1)+' 原文" data-term="'+i+'" data-part="source" value="'+esc(t.source)+'" placeholder="原词"><span>→</span><input aria-label="术语 '+(i+1)+' 译文" data-term="'+i+'" data-part="target" value="'+esc(t.target)+'" placeholder="固定译法"><button class="remove-term" data-remove-term="'+i+'" aria-label="删除术语 '+(i+1)+'">×</button></div>').join('')+(state.terms.length?'':'<p class="field-caption">可添加术语。</p>')+(mode==='review'?'<button class="check-row" data-action="confirm-glossary" aria-pressed="'+state.reviewed+'"><span class="checkbox '+(state.reviewed?'checked':'')+'">'+(state.reviewed?icon('check'):'')+'</span><span>我已确认术语，按这些译法翻译</span></button>':'<p class="field-caption">本次演示中保留。</p>'))+'</div>'}
function preferenceHTML(){return '<div class="preferences-panel"><div class="preference-row"><div class="title">其他外语<small>外语片段</small></div><select aria-label="外语处理方式" data-pref="foreign">'+[['bilingual','原文 + 译文'],['translate','一并翻译'],['preserve','保留原文']].map(([v,l])=>'<option value="'+v+'" '+(state.foreign===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="preference-row"><div class="title">编者注<small>首次出现时解释</small></div><select aria-label="编者注类型" data-pref="notes">'+[['none','不添加'],['terms','词语解释'],['cultural','词语与文化背景']].map(([v,l])=>'<option value="'+v+'" '+(state.notes===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="preference-row"><div class="title">注释保持克制<small>'+ (state.sparse?'每个分块最多 1 条必要说明':'每个分块最多 3 条必要说明') +'</small></div><button class="switch '+(state.sparse?'on':'')+'" data-toggle="sparse" role="switch" aria-checked="'+state.sparse+'" aria-label="注释保持克制"></button></div><div class="preference-row"><div class="title">精译加上语言专家<small>习语与外语片段</small></div><button class="switch '+(state.extraLanguage?'on':'')+'" data-toggle="extraLanguage" role="switch" aria-checked="'+state.extraLanguage+'" aria-label="精译加上语言专家"></button></div></div>'}
function documentOptionsHTML(){return '<section class="config-section"><h2 class="section-title" style="margin-bottom:12px">排版</h2><div class="segmented" role="group" aria-label="排版模式">'+[['reading','阅读排版'],['preserve','保留原文排版']].map(([v,l])=>'<button data-layout="'+v+'" class="'+(state.layout===v?'active':'')+'" aria-pressed="'+(state.layout===v)+'">'+l+'</button>').join('')+'</div></section>'}

function configHTML(){const doc=currentDoc(),blocked=state.glossaryMode==='review'&&!state.reviewed;return backbar()+'<h1 class="screen-title">新翻译</h1><div class="document-summary">'+(docCover(doc,true)||icon(doc.kind==='book'?'book':'doc'))+'<div><b>'+esc(doc.title)+'</b><span class="small muted" style="font-size:10px">'+detectSourceLanguage(doc.source)+' · '+esc(doc.format)+'</span>'+genreBadgeHTML()+'</div><button class="genre-correct" data-action="correct-type" aria-label="校正文稿类型">'+icon('more')+'</button></div><div class="target-row"><label for="target-language">目标语言</label><select id="target-language" aria-label="目标语言">'+targetLanguages.map(([v,n])=>'<option value="'+v+'" '+(state.targetCode===v?'selected':'')+'>'+n+'</option>').join('')+'</select></div><section class="config-section">'+qualityHTML()+'</section><section class="config-section"><h2 class="section-title">翻译风格</h2><button class="selection-row" data-action="choose-style">'+icon('feather')+'<span class="label"><b>'+esc(currentStyle().name)+'</b><small>'+esc(currentStyle().subtitle)+'</small></span>'+icon('arrow','chevron')+'</button></section>'+documentOptionsHTML()+'<section class="config-section"><h2 class="section-title" style="margin-bottom:12px">术语库</h2>'+glossaryHTML()+'</section><section class="config-section"><button class="row spread" data-action="show-prefs" style="width:100%;padding:0;text-align:left"><h2 class="section-title">语言与编者注</h2><span class="small muted" style="font-size:10px">'+(state.showPrefs?'收起':'设置')+'</span></button>'+(state.showPrefs?preferenceHTML():'')+'</section><div class="start-area"><button id="start-button" class="button" data-action="start" '+(blocked?'disabled':'')+'>'+icon('spark')+(blocked?'请先确认术语':'开始演示')+'</button><p class="field-caption">演示 · 不调用模型</p></div>'}

function styleCards(modal=false){return '<div class="style-list">'+styles().map(s=>'<button class="style-card '+(state.style===s.id?'active':'')+'" data-style="'+esc(s.id)+'" '+(modal?'data-in-modal="true"':'')+' aria-pressed="'+(state.style===s.id)+'"><span class="style-letter">'+esc(s.letter||'自')+'</span><span class="style-info"><b>'+esc(s.name)+'</b><small>'+esc(s.subtitle)+'</small><p class="style-description">'+esc(s.description)+'</p>'+(s.example?'<p class="style-example">'+esc(s.example)+'</p>':'')+'</span><span class="style-check '+(state.style===s.id?'checked':'')+'">'+(state.style===s.id?icon('check'):'')+'</span></button>').join('')+'</div>'}
function stylesHTML(){return '<header class="topbar"><div class="app-brand">译风</div><span class="pill gray">演示</span></header>'+styleCards()+'<button class="add-style" data-action="custom-style">'+icon('plus')+'自定义风格</button>'}

function modeHTML(){return '<div class="segmented" role="group" aria-label="使用方式">'+[['payg','按量付费'],['byok','买断自带 API']].map(([v,l])=>'<button data-mode="'+v+'" class="'+(state.mode===v?'active':'')+'" aria-pressed="'+(state.mode===v)+'">'+l+'</button>').join('')+'</div>'}
function settingsHTML(){return '<header class="topbar"><div class="app-brand">设置</div><span class="pill gray">演示</span></header>'+modeHTML()+'<div class="setting-card">'+(state.mode==='payg'?'<button class="setting-link" data-screen="wallet">'+icon('wallet')+'<span>购买点数</span><small>'+state.demoPoints+' 点 · 示例</small>'+icon('arrow')+'</button>':'<button class="setting-link" data-screen="api">'+icon('key')+'<span>自己的 API</span><small>DeepSeek</small>'+icon('arrow')+'</button><button class="setting-link" data-screen="wallet">'+icon('key')+'<span>永久解锁</span>'+icon('arrow')+'</button>')+'</div><div class="settings-heading">默认偏好</div>'+preferenceHTML()+'<div class="setting-card"><button class="setting-link" data-action="intro">'+icon('info')+'<span>使用介绍</span>'+icon('arrow')+'</button><button class="setting-link" data-action="work-lookup">'+icon('book')+'<span>打开译作链接或 ID</span>'+icon('arrow')+'</button></div>'}
function walletHTML(){return backbar('settings','设置')+'<h1 class="screen-title">'+(state.mode==='byok'?'买断解锁':'购买点数')+'</h1><div class="payment-option"><h3>'+(state.mode==='byok'?'自己的 API · 永久':'翻译点数')+'</h3><p>'+(state.mode==='byok'?'一次解锁 · API 用量由服务商计费':'默认 DeepSeek · 按实际输入、输出用量结算')+'</p><button class="button" data-action="payment-unavailable">'+(state.mode==='byok'?'查看买断':'查看点数包')+'</button></div><button class="text-button" data-action="restore-unavailable" style="display:block;margin:18px auto">恢复购买</button><p class="field-caption">演示 · 不会扣款</p>'}
function apiHTML(){return backbar('settings','设置')+'<h1 class="screen-title">我的 API</h1><p class="screen-subtitle">演示 · 不保存密钥</p><label class="field-title" for="api-provider">服务商</label><select id="api-provider"><option>DeepSeek</option><option>OpenAI 兼容接口</option></select><label class="field-title" for="api-endpoint" style="margin-top:21px">API Base URL</label><input id="api-endpoint" value="https://api.deepseek.com" inputmode="url" autocomplete="off"><label class="field-title" for="api-model" style="margin-top:21px">模型</label><input id="api-model" value="deepseek-chat" autocomplete="off"><label class="field-title" for="api-key" style="margin-top:21px">API Key</label><input id="api-key" type="password" placeholder="请勿在交互预览中输入真实密钥" autocomplete="off"><div class="inline-notice">Keychain 保存 · 买断解锁 · 模型费用另计。</div><button class="button" data-action="api-demo">查看配置说明</button>'}
function streamingHTML(){if(state.quality==='fast')return '<div class="stream-card"><div class="row spread"><span class="stream-label">'+(sampleAvailable()?'流式预览':'原文预览')+'</span><span class="pill gray">演示</span></div><p id="stream-text" class="serif"></p></div>';return '<div class="chapter-ready"><span>'+icon('book')+'章节阅读</span><span>审校后就绪</span></div>'}

function processHTML(){let active=Math.min(stages().length-1,Math.floor(state.progress/100*stages().length));return '<div class="row spread"><h1 class="section-title">翻译中</h1><span class="pill gray">演示</span></div><h2 class="process-document">'+esc(currentDoc().title)+'</h2><p class="small muted" style="font-size:11px;margin:0">'+qualityInfo[state.quality].name+' · '+detectSourceLanguage(currentDoc().source)+' → '+targetName()+'</p><div class="process-art"><svg viewBox="0 0 152 152" aria-hidden="true"><circle class="track" cx="76" cy="76" r="66"/><circle id="progress-ring" class="progress" cx="76" cy="76" r="66"/></svg><div class="process-center"><div class="process-percent"><span id="progress-percent">0</span><small>%</small></div></div></div><div id="process-roles">'+rolesHTML(active)+'</div><div id="process-message" class="process-message">'+roleNames[stages()[active]]+'处理中<span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span></div><p id="process-detail" class="process-detail">'+roleDetails[stages()[active]]+'</p>'+streamingHTML()+'<p class="field-caption" style="margin-top:25px">演示 · 未调用模型</p><div class="process-footer"><button data-action="pause">'+(state.paused?'继续':'暂停')+'</button><button data-action="cancel-job">取消</button></div>'}

function updateProgress(){if(!$('#progress-ring'))return;let list=stages(),a=Math.min(list.length-1,Math.floor(state.progress/100*list.length));$('#progress-ring').style.strokeDashoffset=414.7*(1-state.progress/100);$('#progress-percent').textContent=Math.floor(state.progress);$('#process-roles').innerHTML=rolesHTML(a);$('#process-message').innerHTML=state.paused?'已暂停':roleNames[list[a]]+'处理中<span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>';$('#process-detail').textContent=roleDetails[list[a]];let stream=$('#stream-text');if(stream){const text=sampleAvailable()?translatedParagraphs()[0]:currentDoc().source.slice(0,160);stream.textContent=text.slice(0,Math.floor(text.length*state.progress/100));}}
function completeHTML(){let d=currentDoc(),available=sampleAvailable(d);return '<div class="row spread"><h1 class="section-title">演示完成</h1><span class="pill gray">演示</span></div><div class="completed-mark">'+icon('check')+'</div><h2 class="process-document">'+esc(d.title)+'</h2>'+rolesHTML(-1,true)+'<div class="complete-summary"><div class="row spread"><span>质量</span><span>'+qualityInfo[state.quality].name+'</span></div><div class="row spread"><span>目标语言</span><span>'+targetName()+'</span></div><div class="row spread"><span>风格</span><span>'+esc(currentStyle().name)+'</span></div></div><button class="button" data-action="open-result">'+icon('book')+(available?'阅读示例译文':'阅读原文')+'</button><p class="complete-footer">'+(available?'示例章节已就绪':'演示未生成译文')+'</p>'}

function translatedParagraphs(doc=currentDoc()){if(!sampleAvailable(doc))return[];if(doc.id==='guide')return ['设计令牌是用名称表示视觉设计决策的值。颜色、间距和字体排版都应使用设计令牌。','确保组件可访问。每个交互元素都需要清晰的标签和可见的焦点状态。'];let text=[...baseTranslation];if(state.style==='xuzhimo')text[0]='黄昏渐近，玛丽重回米瑟斯韦特庄园的花园。园门仍带着日光的暖。门后，玫瑰在微风里轻轻摇动，风轻得几乎触不到。';if(state.style==='xiangsheng')text[0]='天一擦黑，玛丽又回到米瑟斯韦特庄园那花园里去了。园门还暖着呢，那是太阳留下的温度。门后，玫瑰随着微风轻轻晃动，风轻得她几乎感觉不到。';if(state.style==='watermargin')text[0]='天色将晚，玛丽又来到米瑟斯韦特庄园的花园。园门上尚有日光余温。门后玫瑰随微风轻动，那风甚轻，她几乎不觉。';if(state.style==='literary')text[0]='暮色渐深，玛丽又走进了米瑟斯韦特庄园的花园。园门上还留着太阳的余温。门后，玫瑰在微风里轻轻摇曳，那风几乎让人感觉不到。';if(state.style==='modern')text[0]='傍晚，玛丽再次来到米瑟斯韦特庄园的花园。园门还是暖的。门后，玫瑰随着微风轻轻摆动，那风轻得几乎感觉不到。';if(state.style==='classic')text[0]='暮色将合，玛丽重返米瑟斯韦特庄园之园。园门犹带日暖。门内玫瑰随风轻动，风之微，几不可觉。';if(state.style==='technical')text[0]='黄昏时，玛丽返回了米瑟斯韦特庄园的花园。园门仍有阳光留下的温度。门后，玫瑰在她几乎感觉不到的微风中摇动。';if(state.foreign==='bilingual')text[1]='“Quel jardin merveilleux!（多么美妙的花园！）”她低声说。这一天，她第一次觉得，没有什么需要急着奔赴。';if(state.foreign==='preserve')text[1]='“Quel jardin merveilleux!”她低声说。这一天，她第一次觉得，没有什么需要急着奔赴。';for(const t of state.terms){if(t.source.toLowerCase()==='mary'&&t.target.trim())text=text.map(p=>p.replaceAll('玛丽',t.target));if(t.source.toLowerCase()==='misselthwaite manor'&&t.target.trim())text=text.map(p=>p.replaceAll('米瑟斯韦特庄园',t.target))}return text}

document.addEventListener('click',event=>{const el=event.target.closest('[data-mode],[data-action]');if(!el)return;if(el.dataset.mode){state.mode=el.dataset.mode;render();return}switch(el.dataset.action){case'intro':state.introPage=0;openModal('intro');break;case'intro-next':if(state.introPage<2){state.introPage++;renderModal()}else{closeModal();navigate('home')}break;case'work-lookup':openModal('work-lookup');break;case'work-open':if($('#work-id').value.trim().toUpperCase()==='GARDEN')openModal('work-detail');else toast('演示中可输入 GARDEN');break;case'work-buy':if(!state.demoPurchased){state.demoPoints-=10;state.demoPurchased=true}closeModal();state.selected='garden';state.readerMode='translated';navigate('reader');toast('示例已加入书架 · 再次打开不会重复扣点');break;case'publish':openModal('publish');break;case'publish-demo':if(!$('#work-rights').checked){toast('请先确认分享权利');break}const price=Number($('#work-price').value);if(!Number.isInteger(price)||price<1||price>100000){toast('请输入 1–100000 点');break}closeModal();toast('示例 ID：GARDEN · '+price+' 点 · 未上传');break;}});
let sliderPointer=null;
function sliderRatio(event,slider){const rect=slider.getBoundingClientRect();return Math.max(0,Math.min(1,(event.clientX-rect.left-28)/(rect.width-56)))}
document.addEventListener('pointerdown',event=>{const slider=event.target.closest('#quality-slider');if(!slider)return;event.preventDefault();slider.focus();sliderPointer=event.pointerId;slider.setPointerCapture(event.pointerId);slider.classList.add('dragging');const ratio=sliderRatio(event,slider);updateQualitySlider(Math.round(ratio*2));});
document.addEventListener('pointermove',event=>{if(sliderPointer!==event.pointerId)return;const slider=$('#quality-slider');if(!slider)return;const ratio=sliderRatio(event,slider);updateQualitySlider(Math.round(ratio*2),ratio);});
function endSlider(event){if(sliderPointer!==event.pointerId)return;const slider=$('#quality-slider');sliderPointer=null;if(slider){slider.classList.remove('dragging');updateQualitySlider(['fast','refined','publication'].indexOf(state.quality));}}
document.addEventListener('pointerup',endSlider);document.addEventListener('pointercancel',endSlider);
document.addEventListener('keydown',event=>{if(event.target.id!=='quality-slider')return;let idx=['fast','refined','publication'].indexOf(state.quality),next=idx;if(['ArrowRight','ArrowUp','PageUp'].includes(event.key))next=idx+1;else if(['ArrowLeft','ArrowDown','PageDown'].includes(event.key))next=idx-1;else if(event.key==='Home')next=0;else if(event.key==='End')next=2;else return;event.preventDefault();updateQualitySlider(next);});

render();
</script>
</body>
</html>
